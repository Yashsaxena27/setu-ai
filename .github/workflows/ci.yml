name: Setu AI Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-server:
    name: Validate Server (Typecheck, Test & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install server dependencies
        working-directory: ./server
        run: npm ci || npm install

      - name: Run server automated tests
        working-directory: ./server
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test_secret_minimum_32_characters_long_12345
          MONGODB_URI: mongodb://localhost:27017/setu-test

      - name: Run server TypeScript build
        working-directory: ./server
        run: npm run build

  validate-client:
    name: Validate Client (Lint, Typecheck & Vite Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install client dependencies
        working-directory: ./client
        run: npm ci || npm install

      - name: Build client production bundle
        working-directory: ./client
        run: npm run build
